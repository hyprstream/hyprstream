[package]
name = "hyprstream-synthesis"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Teacher-agnostic synthetic corpus pipeline (System One P1.3): (state, question spec, answer) triples with mandatory option-order permutation + rubric paraphrase augmentation, raw per-teacher probability vectors, provenance + distributability flags, and the family/item contamination firewalls against the frozen vob-1.1 benchmark manifest"

# Deliberately dependency-light and permissive-only: the publishable corpus
# export and this harness feed the MIT-licensed flagship model artifact, so
# this crate must never depend on an AGPL crate (license-boundary.toml
# `permissive_roots`). Encumbered teacher rows are flagged and excluded from
# publishable exports.
[dependencies]
hyprstream-bench = { version = "0.1", path = "../hyprstream-bench" }
hyprstream-decision = { version = "0.1", path = "../hyprstream-decision" }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

workspace-hack = { version = "0.1", path = "../../workspace-hack" }