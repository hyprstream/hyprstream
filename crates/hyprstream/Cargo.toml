[package]
name = "hyprstream"
version = "0.5.0"
edition.workspace = true
description = "Agentic Infrastructure"
documentation = "https://docs.rs/hyprstream"
readme = "README.md"
license = "MIT OR AGPL-3.0-only"
exclude = [
    "**/*.pyc",
    "**/__pycache__/",
]
repository.workspace = true

[lib]
name = "hyprstream_core"
path = "src/lib.rs"
doctest = true

[[bin]]
name = "hyprstream"
path = "src/bin/main.rs"


[dependencies]
# Arrow and DataFusion dependencies removed - focused on ML inference only
bytes.workspace = true
pglite-rs = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }  # Networked Postgres UserStore (#1401)
tokio-postgres = { workspace = true, optional = true }     # Networked Postgres UserStore (#1401)
tokio-postgres-rustls = { workspace = true, optional = true }  # TLS for RDS (#1401)
webpki-roots = { workspace = true, optional = true }       # Mozilla CA roots for RDS TLS (#1401)
aes-gcm-siv.workspace = true             # At-rest UserStore envelope encryption (#1377)
futures.workspace = true
tokio.workspace = true
tonic.workspace = true
async-trait.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
psl.workspace = true
subsecond.workspace = true
json-threat-protection.workspace = true
nix.workspace = true
users.workspace = true
rlimit.workspace = true
tracing-subscriber.workspace = true

# ADBC dependencies removed - focused on ML inference only

# Configuration
config.workspace = true
toml.workspace = true
serde_yaml.workspace = true
git2.workspace = true  # Still needed by git2db internally
git2db = { path = "../git2db", features = ["overlayfs"] }  # High-level git library with overlayfs
cas-serve = { path = "../cas-serve" }  # Content-addressed store reconstruction (getBlob #432)
hyprstream-rpc = { path = "../hyprstream-rpc" }
hyprstream-util = { path = "../hyprstream-util" }  # Generic shared primitives (TtlCache, etc.)
moq-net.workspace = true  # moq-lite streaming for cross-process subscriber (M2b)
ml-dsa = { workspace = true }  # ML-DSA-65 — always compiled (runtime CryptoPolicy selects PQ). See M3 #152.
hyprstream-rpc-std = { path = "../hyprstream-rpc-std" }  # Standard service schemas + clients
hyprstream-discovery = { path = "../hyprstream-discovery" }  # Service discovery
hyprstream-pds = { path = "../hyprstream-pds" }  # atproto PDS record store: DAG-CBOR + MST + signed commit + CAR proof (#392/#431)
hyprstream-pds-service = { path = "../hyprstream-pds-service" }  # authority-owned hosted-account tenant lookup
hyprstream-ledger = { path = "../hyprstream-ledger", optional = true }  # Cellular credit ledger accounting plane (#923); the Phase-1 local-enforcer service (#925) lands behind the `ledger` feature, default off
hyprstream-crypto = { path = "../hyprstream-crypto" }  # COSE composite (EdDSA + ML-DSA-65) sign/verify — used by the ledger checkpoint signer (#925)
hyprstream-service = { path = "../hyprstream-service" }  # Service orchestration
hyprstream-rpc-derive = { path = "../hyprstream-rpc-derive" }  # RPC code generation proc macros
hyprstream-flight = { path = "../hyprstream-flight", optional = true }  # Flight SQL server and client
hyprstream-metrics = { path = "../hyprstream-metrics", optional = true }  # Metrics storage (DuckDB) — optional so pglite builds don't link DuckDB (#1376 P1)
hyprstream-workers = { path = "../hyprstream-workers" }  # Worker runtime (Kata containers)
hyprstream-vfs = { path = "../hyprstream-vfs" }  # VFS namespace (Mount trait)
hyprstream-9p = { path = "../hyprstream-9p" }  # 9P codec + Kata translator (Backend, Translator)
hyprstream-workers-tcl = { path = "../hyprstream-workers-tcl" }  # Tcl shell (TclMount, TclCommand)
hyprstream-workers-python = { path = "../hyprstream-workers-python" }  # Python shell (PythonMount, PyCommand)
inventory.workspace = true  # Service factory registration
hyprstream-p2p = { workspace = true, optional = true }  # P2P transport (formerly gittorrent)
clap.workspace = true
inquire = "0.7"
tracing.workspace = true
parking_lot.workspace = true
num_cpus.workspace = true
once_cell.workspace = true  # For global GitService singleton
dirs = "5"  # User directory paths for CLI

rmcp = { version = "0.14", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
http = "1"  # HTTP types (request::Parts) for MCP identity extraction

tracing-log.workspace = true
tracing-appender.workspace = true
tui-logger = { version = "0.18", default-features = false }
log = "0.4"
bincode.workspace = true
tokio-stream.workspace = true
hex.workspace = true
chrono.workspace = true
async-stream.workspace = true
anyhow.workspace = true
sha2.workspace = true  # SHA256 validation for LFS files
hmac.workspace = true  # HMAC for authenticated stream chunks
daemonize.workspace = true
prost.workspace = true
rcgen.workspace = true  # Self-signed TLS cert generation for QUIC
rustls.workspace = true  # TLS runtime (ring crypto provider for axum-server)
rustls-pemfile.workspace = true  # PEM file parsing for TLS certs
rustls-acme.workspace = true  # ACME (Let's Encrypt / step-ca) automatic cert provisioning
web-transport-quinn.workspace = true
zeroize.workspace = true  # Zeroing private key material on drop
time = "0.3"  # Datetime types for certificate validity

# HTTP socket activation (systemd)
listenfd = { version = "1.0", optional = true }

# ML dependencies
thiserror.workspace = true
rayon.workspace = true  # Parallel processing for tensor operations
memmap2.workspace = true
rand.workspace = true
tch = { git = "https://github.com/hyprstream/tch-rs", branch = "hyprstream" }
bitsandbytes-sys = { path = "../bitsandbytes-sys", optional = true }  # KV cache quantization

# Candle ML Framework - REMOVED: Fully migrated to Tch (PyTorch Rust bindings)
# candle-core = "0.9.1"
# candle-nn = "0.9.1"
# candle-transformers = "0.9.1"
# candle-examples = "0.9.1"
tokenizers.workspace = true
safetensors.workspace = true
image.workspace = true
regex.workspace = true
minijinja.workspace = true

# Runtime Integration Dependencies
# llama-cpp-2 = "0.1.67"          # REMOVED: Replaced by Tch (PyTorch) inference
# mistralrs dependencies commented out during Candle migration
# mistralrs = { path = "../mistral.rs/mistralrs" }
# mistralrs-core = { path = "../mistral.rs/mistralrs-core" }
# hf-hub removed - using Git for all model downloads

uuid.workspace = true
automerge = "0.5"  # CRDT collaborative editing
capnp.workspace = true  # Cap'n Proto runtime
capnp-futures.workspace = true  # Cap'n Proto async support
glob.workspace = true
walkdir.workspace = true
reqwest.workspace = true
jsonwebtoken = { workspace = true }
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
libc = "0.2"  # For system calls in overlay2 driver
reflink-copy = "0.1"  # COW file copying (reflink when available)
hyprstream-containedfs.workspace = true  # Path-contained filesystem operations
rocksdb = "0.23"  # User credential store (RocksDbUserStore)
fred = { version = "9", optional = true, features = ["i-scripts"] }  # Async Redis/Valkey client (ValkeyUserStore, ValkeyTokenStore)
hyprstream-tui = { path = "../hyprstream-tui" }  # Setup wizard TUI (WizardBackend trait + WizardApp)
hyprstream-compositor = { path = "../hyprstream-compositor" }  # Pure TUI compositor (chrome state machine)
waxterm = { path = "../waxterm", features = ["avt"] }  # Terminal abstraction for TUI rendering
ratatui = { version = "0.30", default-features = false }  # TUI framework for pane buffers
# Link a critical-section implementation for this binary. Under the release image
# build (`--no-default-features`) the transitive once_cell/ahash-0.7 chain enables
# the critical-section API with no impl selected, breaking the link with
# `undefined symbol: _critical_section_1_0_acquire`. All our targets are std.
critical-section = { version = "1", features = ["std"] }
vte = "0.13"  # VT100/ANSI escape sequence parser for TUI pane ingestion

[target.'cfg(target_os = "linux")'.dependencies]
lru.workspace = true  # LRU cache for model caching and Git repository handles
dashmap.workspace = true  # Concurrent HashMap for thread-safe repository caching
bitflags.workspace = true  # Capability flags for archetype detection
casbin = "2"  # Access control library for RBAC/ABAC
indicatif.workspace = true              # Progress bars
fastrand.workspace = true                # Fast random number generation for sampling
rand.workspace = true                    # Cryptographic random for OAuth auth codes
xdg.workspace = true                     # XDG Base Directory specification
blake3.workspace = true                  # Fast cryptographic hashing for checksums
ciborium.workspace = true                # Canonical CBOR for tamper-evident audit records (#677 Fu6)
tempfile.workspace = true                # Temporary files for model conversion
base64.workspace = true                  # JWT token encoding
ed25519-dalek.workspace = true           # JWT Ed25519 signatures
ssh-key = { version = "0.6", features = ["ed25519", "encryption"] }  # OpenSSH Ed25519 key import (user create --ssh)
p256.workspace = true                    # ES256 DPoP verification (atproto interop)
k256.workspace = true                    # ES256K ATProto service-auth verification
keyring = { version = "3", features = ["linux-native"] }  # OS keyring — Linux keyutils
curve25519-dalek.workspace = true        # Ristretto255 DH for stream authentication
hkdf.workspace = true                    # HKDF key derivation
bs58 = "0.5"                             # Base58 encoding for device fingerprints
subtle.workspace = true                  # Constant-time operations
ring = "0.17"                            # TLS endorsement signing (key-type-agnostic)

# HTTP API dependencies
# `ws` feature: 9P-over-WebSocket export (H1a / #764) on the existing server.
axum = { workspace = true, features = ["ws"] }
axum-server.workspace = true
tower-http.workspace = true
url.workspace = true
percent-encoding.workspace = true
urlencoding.workspace = true
shellexpand.workspace = true

# macOS/iOS: Keychain via apple-native
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Windows: Credential Manager via windows-native
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# FreeBSD/OpenBSD: DBus Secret Service (requires libdbus-1-dev + a running daemon)
[target.'cfg(any(target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# OpenTelemetry (#1305): the SDK/OTLP stack is not wasm32-compatible (SDK
# std::time panic opentelemetry-rust#696; OTLP Send-bounds #3155 — both
# upstream-open), so the optional `otel` deps are native-only. The `otel`
# feature may still be *enabled* on a wasm32 build (feature flags are
# target-independent); all otel code is therefore gated
# `#[cfg(all(feature = "otel", not(target_arch = "wasm32")))]`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-semantic-conventions = { workspace = true, optional = true }
opentelemetry-stdout = { workspace = true, optional = true }

[features]
# The credential/PDS service is the default production shape. Keep DuckDB-backed
# metrics opt-in: DuckDB and PGlite export overlapping PostgreSQL C symbols and
# cannot be linked into the same process.
default = ["gittorrent", "xet", "systemd", "otel", "kata-vm", "nspawn"]
cuda = []
valkey = ["dep:fred"]  # Enable Valkey/Redis-backed user and token stores
pglite = ["dep:pglite-rs"]  # Enable PGlite embedded relational UserStore (#1376)
postgres = ["dep:deadpool-postgres", "dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:webpki-roots"]  # Networked Postgres UserStore for RDS (#1401)
credential-pds = ["pglite"]  # Production credential/PDS service profile; intentionally excludes metrics/DuckDB
credential-pds-postgres = ["postgres"]  # Production credential/PDS with RDS Postgres backend (#1401)
metrics = ["dep:hyprstream-metrics", "dep:hyprstream-flight"]  # Separate DuckDB-backed metrics/inference/Flight service build
bnb = ["dep:bitsandbytes-sys"]  # Enable bitsandbytes KV cache quantization (requires compatible ROCm/CUDA)
xet = ["git2db/xet-storage"]  # Enable XET large file storage
# NOTE: plain dependency names (not `dep:`) — cargo rejects `dep:` references
# to target-specific optional dependencies, and the otel stack is target-gated
# to non-wasm (#1305, see the target table below). On wasm32 the feature may be
# enabled but pulls nothing; all otel code is gated
# `#[cfg(all(feature = "otel", not(target_arch = "wasm32")))]`.
otel = ["tracing-opentelemetry", "opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "opentelemetry-semantic-conventions", "opentelemetry-stdout"]
gittorrent = ["dep:hyprstream-p2p", "git2db/gittorrent-transport"]  # Enable P2P model sharing via hyprstream-p2p transport (feature name kept for compat)
download-libtorch = ["tch/download-libtorch"]
overlayfs = ["git2db/overlayfs"]  # Enable overlayfs-backed worktrees (delegated to git2db)
systemd = ["hyprstream-rpc/systemd", "hyprstream-service/systemd", "hyprstream-workers/systemd", "dep:listenfd"]  # Systemd integration (socket activation, service units)
oci-image = ["hyprstream-workers/oci-image"]  # Universal mountable OCI/RAFS image filesystem service (ImageFs, an FsMount); composable by any backend (#633)
# Kata/Cloud-Hypervisor VM worker backend (#518: granular per-BackendType feature).
# Implies oci-image (kata serves it via virtio-fs). `kata-vm` (below) is the
# backward-compat alias that forwards to this.
kata = ["hyprstream-workers/kata", "oci-image"]
# Backward-compat convenience alias (#518): `kata-vm` now forwards to the
# granular `kata` feature. Existing `--features kata-vm` keeps working.
kata-vm = ["kata"]
# systemd-nspawn lightweight-container worker backend (#518: per-BackendType
# feature). In default so the app keeps the nspawn auto-fallback tier; drop it
# (and kata-vm) for a wasm/oci/cri-only build.
nspawn = ["hyprstream-workers/nspawn"]
experimental = ["hyprstream-compositor/experimental"]  # EXPERIMENTAL: Enable service/worker panels, git write operations
pq-hybrid = []  # NO-OP alias: PQ primitives always compiled; Classical/Hybrid selected at runtime. See M3 #152.
# Phase-1 cellular-ledger local-enforcer (epic #922, #925): the `ledger` service
# (actor + CreditGate + LocalEnforcer + receipt emitter + ReceiptDebt breaker).
# Default OFF — the scheduler quota path is unchanged until this is opted into
# and the 1.9 suites pass. MemLedger is the Phase-1 backend; RocksLedger (item
# 1.2) lands separately.
ledger = ["dep:hyprstream-ledger"]

[build-dependencies]
capnpc.workspace = true  # Cap'n Proto schema compiler
capnp.workspace = true   # Cap'n Proto runtime for schema parsing
serde_json.workspace = true  # JSON output for metadata
hyprstream-rpc-build.workspace = true  # Shared annotation extraction

[dev-dependencies]
hyprstream-rpc = { path = "../hyprstream-rpc", features = ["test-classical-policy"] }
criterion.workspace = true
proptest.workspace = true  # S5 #571 M2: differential faithfulness property tests
tempfile.workspace = true
tokio-stream.workspace = true
# Test-only: iroh substrate types used by `tests/policy_over_iroh.rs`.
iroh.workspace = true
web-transport-iroh.workspace = true
rand.workspace = true
# Test-only: drive the xet axum Router via `ServiceExt::oneshot` (auth-reject test).
tower = { version = "0.5", features = ["util"] }
# Test-only: WebSocket client for the 9P-over-WS attach round-trip (H1a / #764).
tokio-tungstenite = "0.24"
# Test-only: the `testing` feature exposes `InMemoryMetricExporter` for the
# token-burn meter tests. The SDK compiles it under cfg(test) or this feature;
# dependencies are not built with cfg(test), so the feature is required here.
# Dev-only and non-wasm-only (the OTel family is target-gated off wasm32), so
# production and wasm builds are unaffected.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[lints]
workspace = true
