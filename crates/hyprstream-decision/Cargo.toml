[package]
name = "hyprstream-decision"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "jev-1 decision/question schema IR, language-agnostic authoring (YAML/JSON), canonical serialization, and Arrow emission for the System One program"

# Deliberately dependency-light: no tokio, no RPC/VFS/metrics deps. The IR and
# Arrow contracts are consumed by the eval harness (P0.4), the stub service
# (P0.7), the question encoder (P1.1), and the ADBC operator (P3.5), so this
# crate must stay a permissive-only leaf (license-boundary.toml).
[dependencies]
arrow-array = "56.2.0"
arrow-schema = "56.2.0"
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
