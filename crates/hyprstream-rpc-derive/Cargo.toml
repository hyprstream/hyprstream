[package]
name = "hyprstream-rpc-derive"
version = "0.1.0"
publish = ["crates-io"]
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Derive macros for hyprstream RPC serialization"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing", "extra-traits"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
capnp = { workspace = true }
hyprstream-rpc-build = { version = "=0.1.0", path = "../hyprstream-rpc-build" }

[lints]
workspace = true
