# Target map for the license-graph guard. This is intentionally separate from
# Cargo manifest licenses so the guard lands before the mechanical relicense.
[license_gate]
apache_roots = [
  "hyprstream-crypto",
  "hyprstream-k8s",
  "hyprstream-rpc",
  "hyprstream-rpc-build",
  "hyprstream-rpc-derive",
  "hyprstream-rpc-std",
  "hyprstream-tui",
  "hyprstream-util",
  "hyprstream-vfs",
  "hyprstream-workers-python",
  "hyprstream-workers-python-guest",
  "hyprstream-workers-tcl",
  "hyprstream-workers-wasmtime",
  "hyprstream-workers-wasmtime-fsguest",
]

agpl_services = [
  "hyprstream",
  "hyprstream-appview",
  "hyprstream-discovery",
  "hyprstream-k8s-pds",
  "hyprstream-ledger",
  "hyprstream-pds",
  "hyprstream-pds-service",
  "hyprstream-service",
]

# Packages outside the one-way Apache-library/AGPL-service boundary remain
# explicit so deleting any classification fails closed.
other_packages = [
  "bitsandbytes-sys",
  "cas-serve",
  "chat-core",
  "git-xet-filter",
  "git2db",
  "hyprstream-9p",
  "hyprstream-compositor",
  "hyprstream-containedfs",
  "hyprstream-flight",
  "hyprstream-metrics",
  "hyprstream-p2p",
  "hyprstream-resource",
  "hyprstream-vfs-server",
  "hyprstream-workers",
  "waxterm",
]
