name: Docs publish

# Build the full-workspace rustdoc on every landing push to main, pack it
# into a content-addressed IPFS CAR, and hand the CAR to the promotion
# pipeline in cyberdione/ingest (GitLab), which re-derives the CID from the
# CAR bytes, pins it, and promotes the DNSLink record. This workflow never
# pins and never touches DNS; the manifest it emits is a claim the promoter
# does not need to trust. Mirrors cyberdione-corp's option-B ipfs-publish
# design (ci/ipfs-publish*.sh there).
#
# Job structure mirrors rust.yml: self-hosted Graviton merge-gate runner,
# pinned builder image loaded via .github/scripts/load-builder-image.sh and
# driven through `podman run` (no job-level `container:` — the rootless
# podman AMI exposes no Docker socket). libtorch for the tch-rs build
# scripts comes from the image (/opt/libtorch), as in rust.yml's build job.
# No AWS/OIDC: rustdoc output is not sccache-cacheable, so the image's
# sccache wrapper is disabled and no credentials are forwarded, matching
# rustdoc.yml. Compiled deps persist across runs in a dedicated namespace on
# the shared EBS cache volume; the rendered target/doc is copied back into
# the checkout for packing and artifact upload.
#
# The GitLab delivery steps are guarded on the GITLAB_PACKAGE_TOKEN /
# GITLAB_TRIGGER_TOKEN secrets and skip cleanly (with a notice) until those
# are provisioned.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Publishes are serialized and never cancelled mid-run: a killed pack/upload
# could leave a half-written generic package under a CID version.
concurrency:
  group: docs-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: rustdoc → IPFS CAR → GitLab promotion handoff
    runs-on: [self-hosted, linux, arm64, graviton, hyprstream-merge-gate]
    # Cold full-workspace doc build + pack + a 15-minute promotion poll must
    # fit; bounded by the fleet's 150-minute reaper cap.
    timeout-minutes: 150
    env:
      # Mapped through env so step-level `if:` can test secret presence
      # (secrets.* is not usable in `if:` conditions directly).
      GITLAB_PACKAGE_TOKEN: ${{ secrets.GITLAB_PACKAGE_TOKEN }}
      GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The immutable arm64 builder image is shared by rust.yml, the
      # preflight, and AppImage packaging. Keep its sole pin in
      # .github/builder-image.env.
      - name: Load builder image pin
        run: bash .github/scripts/load-builder-image.sh

      - name: Pull builder image
        run: podman pull "$BUILDER_IMAGE"

      - name: Build full-workspace rustdoc (in rust-builder container)
        run: |
          # Runner boot labels this target subtree container_file_t; leave the
          # container confined and retain :Z only on the checked-out source.
          podman run --rm \
            -v "$PWD":/build:Z -w /build \
            -v /mnt/hypr-ci-cache:/mnt/hypr-ci-cache \
            -e RUSTC_WRAPPER= \
            -e LIBTORCH=/opt/libtorch -e LD_LIBRARY_PATH=/opt/libtorch/lib \
            -e LIBTORCH_BYPASS_VERSION_CHECK=1 -e OPENSSL_NO_VENDOR=1 \
            -e CARGO_TARGET_DIR=/mnt/hypr-ci-cache/target/hyprstream-docs-publish \
            -e CARGO_INCREMENTAL=0 -e CARGO_TERM_COLOR=always \
            "$BUILDER_IMAGE" \
            bash -euo pipefail -c '
              bash .github/scripts/verify-libtorch.sh
              cargo doc --locked --workspace --no-deps
            '

      - name: Stage rustdoc tree for packing
        run: |
          rm -rf target/doc
          mkdir -p target
          cp -a /mnt/hypr-ci-cache/target/hyprstream-docs-publish/doc target/doc

      # The locked packer graph (ipfs-car@3.1.0, byte-parity with
      # cyberdione-corp — the promotion side re-derives the CID from the CAR)
      # is installed from the committed lockfile only; lifecycle scripts are
      # never run.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked packer graph
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix ci/docs-publish

      - name: Pack rustdoc into IPFS CAR
        run: bash ci/docs-publish/pack.sh target/doc

      - name: Upload IPFS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hyprstream-docs-ipfs-${{ github.sha }}
          path: ipfs/
          if-no-files-found: error
          # Evidence for which CID a given commit produced; the promoter
          # fetches the same CAR from the GitLab package registry.
          retention-days: 90

      - name: Notice — delivery skipped
        if: ${{ env.GITLAB_PACKAGE_TOKEN == '' || env.GITLAB_TRIGGER_TOKEN == '' }}
        run: |
          echo "delivery skipped: tokens not provisioned"

      - name: Deliver CAR to GitLab and await promotion
        if: ${{ env.GITLAB_PACKAGE_TOKEN != '' && env.GITLAB_TRIGGER_TOKEN != '' }}
        run: bash ci/docs-publish/deliver.sh
