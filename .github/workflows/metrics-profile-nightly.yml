name: Metrics profile nightly

# Non-production insurance for the `metrics` feature profile (the DuckDB-backed
# standalone service build, mutually exclusive with the default PGlite profile
# at link time). Its two serial phases were removed from the required merge gate
# on 2026-09-14 because nothing ships or deploys the profile today and they
# cost ~19 min of every merge candidate. This nightly keeps the profile
# compiling and its typed handler tests running so it cannot silently bit-rot
# while pre-product. If the metrics service becomes production, restore the
# phases to graviton-build-test.sh (and delete this note).
on:
  schedule:
    # 05:37 UTC — off-peak for the fleet, off the :00/:30 marks.
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_BUCKET: ${{ vars.AWS_SCCACHE_BUCKET }}
  SCCACHE_REGION: ${{ vars.AWS_SCCACHE_REGION }}
  CARGO_INCREMENTAL: 0

jobs:
  metrics-profile:
    name: Metrics profile build + typed handler tests
    runs-on: [self-hosted, linux, arm64, graviton, hyprstream-merge-gate]
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Load builder image pin
      run: bash .github/scripts/load-builder-image.sh

    - name: Configure AWS credentials (OIDC → sccache S3)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_SCCACHE_ROLE_ARN }}
        aws-region: ${{ vars.AWS_SCCACHE_REGION }}

    - name: Pull builder image
      run: podman pull "$BUILDER_IMAGE"

    # The exact two commands the merge gate ran for this profile before the
    # lane was removed (see graviton-build-test.sh history): the release build
    # proves the DuckDB profile still links (the PGlite/DuckDB PostgreSQL
    # C-symbol exclusivity only manifests at link time), and the lib tests run
    # the typed handlers. tch is a non-optional dependency of the crate, so
    # libtorch from the image is still required here.
    - name: Build metrics profile + run typed handler tests (in rust-builder container)
      run: |
        # Runner boot labels this target subtree container_file_t; leave the
        # container confined and retain :Z only on the checked-out source.
        podman run --rm \
          -v "$PWD":/build:Z -w /build \
          -v /mnt/hypr-ci-cache:/mnt/hypr-ci-cache \
          -e RUSTC_WRAPPER=sccache -e SCCACHE_BUCKET -e SCCACHE_REGION \
          -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
          -e AWS_REGION -e AWS_DEFAULT_REGION \
          -e LIBTORCH=/opt/libtorch -e LD_LIBRARY_PATH=/opt/libtorch/lib \
          -e LIBTORCH_BYPASS_VERSION_CHECK=1 -e OPENSSL_NO_VENDOR=1 \
          -e CARGO_TARGET_DIR=/mnt/hypr-ci-cache/target/hyprstream \
          -e CARGO_INCREMENTAL=0 -e CARGO_TERM_COLOR=always \
          "$BUILDER_IMAGE" \
          bash -euo pipefail -c '
            cargo build -p hyprstream --bin hyprstream --locked --release --no-default-features --features metrics
            cargo test -p hyprstream --locked --lib --no-default-features --features metrics services::metrics::tests::
            sccache --show-stats
          '
