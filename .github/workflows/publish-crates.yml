name: Publish supported Rust crates

# crates.io versions are immutable. Only a protected, annotated release tag can
# start this workflow; main-branch builds are validation, never a staging publish.
on:
  push:
    tags:
      - "crates-v*"

permissions:
  contents: read

concurrency:
  group: crates-io-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and verify crates.io release
    runs-on: ubuntu-latest
    environment: crates-io-publish
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the immutable tag revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release policy and protected source
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_crate_release_policy.py

          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^crates-v([0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?)$ ]] || {
            echo "::error::invalid crate release tag: $tag"
            exit 1
          }
          version="${BASH_REMATCH[1]}"

          # Require an annotated tag. GitHub tag protection makes its ref
          # immutable; the annotation makes release intent explicit.
          [[ "$(git cat-file -t "refs/tags/$tag")" == tag ]] || {
            echo "::error::$tag must be an annotated tag"
            exit 1
          }

          tag_commit="$(git rev-list -n 1 "refs/tags/$tag")"
          [[ "$(git rev-parse HEAD)" == "$tag_commit" ]] || {
            echo "::error::checkout does not match $tag"
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$tag_commit" origin/main || {
            echo "::error::$tag does not point to a commit reachable from main"
            exit 1
          }

          mapfile -t crates < <(python3 - <<'PY'
          import tomllib
          with open('.github/crate-release.toml', 'rb') as handle:
              print(*tomllib.load(handle)['public_now'], sep='\n')
          PY
          )
          [[ "${#crates[@]}" -gt 0 ]] || exit 1
          for crate in "${crates[@]}"; do
            manifest_version="$(
              cargo metadata --no-deps --format-version 1 |
                jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version'
            )"
            [[ "$manifest_version" == "$version" ]] || {
              echo "::error::$crate version $manifest_version does not match tag $version"
              exit 1
            }
          done

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          {
            echo 'crates<<EOF'
            printf '%s\n' "${crates[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to crates.io with GitHub OIDC
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish in dependency order and verify registry checksums
        env:
          CRATES_IO_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_CRATES: ${{ steps.release.outputs.crates }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r crate; do
            [[ -n "$crate" ]] || continue
            .github/scripts/publish-crate.sh "$crate" "$RELEASE_VERSION"
          done <<< "$RELEASE_CRATES"
          sha256sum target/package/*.crate | sort -k2 > target/package/SHA256SUMS

      - name: Attest packaged crate provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: target/package/*.crate

      - name: Upload package evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crates-${{ steps.release.outputs.version }}
          path: |
            target/package/*.crate
            target/package/*.files
            target/package/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Smoke test clean crates.io consumer
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_CRATES: ${{ steps.release.outputs.crates }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hyprstream-crates-smoke
          cargo init --lib --name hyprstream-crates-smoke /tmp/hyprstream-crates-smoke
          {
            echo
            while IFS= read -r crate; do
              [[ -n "$crate" ]] || continue
              printf '%s = "=%s"\n' "$crate" "$RELEASE_VERSION"
            done <<< "$RELEASE_CRATES"
          } >> /tmp/hyprstream-crates-smoke/Cargo.toml

          cd /tmp/hyprstream-crates-smoke
          for attempt in {1..30}; do
            rm -f Cargo.lock
            if cargo generate-lockfile; then
              break
            fi
            [[ "$attempt" -lt 30 ]] || exit 1
            sleep 10
          done
          cargo check --locked

          metadata="$(cargo metadata --locked --format-version 1)"
          while IFS= read -r crate; do
            [[ -n "$crate" ]] || continue
            jq -e --arg crate "$crate" --arg version "$RELEASE_VERSION" '
              .packages[] |
              select(.name == $crate and .version == $version) |
              .source | startswith("registry+")
            ' <<< "$metadata" >/dev/null
          done <<< "$RELEASE_CRATES"
