name: Merge-gate preflight

# An opt-in, full merge-gate-equivalent build for a PR before it enters the
# required merge queue. It is intentionally separate from `rust.yml`: a normal
# PR retains fast feedback, while a maintainer can request this expensive gate
# from either Actions or the PR's `run-preflight` label.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to validate
        required: true
        type: string
      runner_label:
        description: Runner flavor (use benchmark labels only for controlled sizing tests)
        required: true
        default: hyprstream-preflight
        type: choice
        options:
          - hyprstream-preflight
          - hyprstream-benchmark-4xlarge
          - hyprstream-benchmark-8xlarge
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  # A newer request for the same PR supersedes the older one; different PRs may
  # use the two-worker preflight pool concurrently.
  group: merge-gate-preflight-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_BUCKET: ${{ vars.AWS_SCCACHE_BUCKET }}
  SCCACHE_REGION: ${{ vars.AWS_SCCACHE_REGION }}
  CARGO_INCREMENTAL: 0

jobs:
  resolve-pr:
    # A label is merely the PR-page control; only this exact label starts a run.
    # `pull_request_target` executes this controller from the trusted base
    # branch, then resolves an immutable current head SHA through the API.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'run-preflight')
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.pr.outputs.sha }}
      url: ${{ steps.pr.outputs.url }}
    steps:
    - id: pr
      uses: actions/github-script@v7
      with:
        script: |
          const number = Number(
            context.eventName === 'pull_request_target'
              ? context.payload.pull_request.number
              : context.payload.inputs.pr_number
          );
          if (!Number.isSafeInteger(number) || number <= 0) {
            core.setFailed('pr_number must be a positive PR number');
            return;
          }

          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: number,
          });
          if (pr.state !== 'open') {
            core.setFailed(`PR #${number} is not open`);
            return;
          }
          core.setOutput('number', String(number));
          core.setOutput('sha', pr.head.sha);
          core.setOutput('url', pr.html_url);

  build:
    name: Build + test (arm64 preflight)
    needs: resolve-pr
    runs-on: [self-hosted, linux, arm64, graviton, "${{ inputs.runner_label || 'hyprstream-preflight' }}"]
    # Keep below the 150-minute reaper cap. This is deliberately the same full
    # validation script as the required merge-gate `build` job in rust.yml.
    timeout-minutes: 140
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.resolve-pr.outputs.sha }}
        persist-credentials: false

    - name: Load builder image pin
      run: bash .github/scripts/load-builder-image.sh

    - name: Report validated revision
      run: |
        echo "Preflighting PR #${{ needs.resolve-pr.outputs.number }} at ${{ needs.resolve-pr.outputs.sha }}"
        echo "${{ needs.resolve-pr.outputs.url }}"

    - name: Configure AWS credentials (OIDC → sccache S3)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_SCCACHE_ROLE_ARN }}
        aws-region: ${{ vars.AWS_SCCACHE_REGION }}

    - name: Pull builder image
      run: podman pull "$BUILDER_IMAGE"

    # Match the required Graviton gate's dedicated persistent Cargo target.
    # Fail before the expensive container build if the runner did not mount the
    # provisioned cache; never create a root-backed fallback on the workspace.
    - name: Verify preflight Cargo cache mount
      run: |
        set -euo pipefail
        echo "workspace filesystem"
        df -h "$PWD"
        df -i "$PWD"
        if [[ ! -e /mnt/hypr-ci-cache ]]; then
          echo "required cache path is absent: /mnt/hypr-ci-cache" >&2
          exit 1
        fi
        echo "Cargo cache filesystem"
        df -h /mnt/hypr-ci-cache
        df -i /mnt/hypr-ci-cache
        mountpoint -q /mnt/hypr-ci-cache
        test -d /mnt/hypr-ci-cache/target/hyprstream
        test -w /mnt/hypr-ci-cache/target/hyprstream

    # The browser-WASM phase runs inside graviton-build-test.sh as the non-root
    # ci user. Install Chromium and its matching driver while the container is
    # still root so the real browser test can execute instead of failing when
    # apt/dnf is attempted after the user switch.
    - name: Generate browser conformance nonce
      run: |
        echo "BROWSER_ATTEST_NONCE=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')" >> "$GITHUB_ENV"

    - name: Build + test (release, in rust-builder container)
      run: |
        # The runner's IaC must label this existing cache container_file_t;
        # do not relabel the whole cache with :Z or disable confinement.
        podman run --rm \
          -v "$PWD":/build:Z -w /build \
          -v /mnt/hypr-ci-cache:/mnt/hypr-ci-cache \
          -e RUSTC_WRAPPER=sccache -e SCCACHE_BUCKET -e SCCACHE_REGION \
          -e SCCACHE_IDLE_TIMEOUT=0 \
          -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
          -e AWS_REGION -e AWS_DEFAULT_REGION \
          -e LIBTORCH=/opt/libtorch -e LD_LIBRARY_PATH=/opt/libtorch/lib \
          -e LIBTORCH_BYPASS_VERSION_CHECK=1 -e OPENSSL_NO_VENDOR=1 \
          -e CARGO_TARGET_DIR=/mnt/hypr-ci-cache/target/hyprstream \
          -e CARGO_INCREMENTAL=0 -e CARGO_TERM_COLOR=always -e CI=true \
          -e BROWSER_ATTEST_NONCE \
          "$BUILDER_IMAGE" \
          bash -euo pipefail -c '
            bash /build/.github/scripts/install-chromium.sh
            test -d /mnt/hypr-ci-cache/target/hyprstream
            test -w /mnt/hypr-ci-cache/target/hyprstream
            useradd -m ci
            chmod a+rx /root
            chmod -R a+rwX /root/.cargo /root/.rustup
            chown -R ci:ci /build
            runuser -u ci -- test -w /mnt/hypr-ci-cache/target/hyprstream
            runuser -u ci -- bash -euo pipefail /build/.github/scripts/graviton-build-test.sh
          '

    # browser-wasm-test.sh writes this only after the real headless browser
    # test succeeds. The nonce is fresh for this run, so a missing or stale
    # receipt cannot satisfy the preflight.
    - name: Assert browser conformance receipt
      run: |
        grep -qx "$BROWSER_ATTEST_NONCE" browser-wasm-receipt.txt || {
          echo "browser-wasm conformance phase did not execute in this run (receipt missing or stale)" >&2
          exit 1
        }
