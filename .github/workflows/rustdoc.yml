name: Rustdoc quality

# Non-blocking documentation-quality lane (policy: docs/rustdoc-quality.md).
#
# Scope is deliberately the hyprstream-util PILOT only: `cargo doc` on this one
# dependency-light leaf crate (parking_lot only) with `--no-deps`. It is NOT a
# required check and NOT part of the man/protocol/corpus artifact pipeline —
# the artifacts uploaded here exist solely as review evidence for documentation
# quality on PRs that touch the pilot. Expanding coverage to further crates is
# a per-crate, measured, opt-in process documented in docs/rustdoc-quality.md;
# this workflow must not silently grow into a workspace-wide docs gate.
#
# Warning policy: rustdoc GENERATION errors fail the job (a broken build is a
# failure, not a warning); missing-doc WARNINGS are collected and uploaded as
# evidence but do not fail the job while the lane is non-blocking. The strict
# step below runs the same scoped doc with `RUSTDOCFLAGS="-D warnings"` under
# `continue-on-error` purely to produce machine-checkable evidence of the
# current warning debt.
#
# Use the same self-hosted ARM64 runner and pinned builder as rust.yml.
# The util-only pilot needs no workspace build, libtorch setup, or S3 cache:
# disable the image's sccache wrapper and keep target/doc in the checkout for
# artifact upload. No OIDC/AWS credentials are requested or forwarded.
on:
  pull_request:
    paths:
      - 'crates/hyprstream-util/**'
      - '.github/workflows/rustdoc.yml'
      - '.github/scripts/load-builder-image.sh'
      - '.github/builder-image.env'
      - 'docs/rustdoc-quality.md'
      # Shared build inputs: workspace dependencies, the lockfile, and the
      # toolchain pin all influence rustdoc behavior for the pilot crate.
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rustdoc-util:
    name: rustdoc (hyprstream-util pilot)
    runs-on: [self-hosted, linux, arm64, graviton, hyprstream-merge-gate]
    # The workspace-hack (cargo-hakari, Wave D) puts the union dependency
    # closure behind every leaf crate, so even `cargo doc --no-deps` must
    # build that closure's metadata — and the evidence step re-runs the doc
    # a second time with -D warnings. Both passes at CARGO_BUILD_JOBS=2 on
    # the shared runner exceed the former 20-minute budget (two consecutive
    # attempts died at exactly 20m), hence 45.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Load builder image pin
        run: bash .github/scripts/load-builder-image.sh

      - name: Pull builder image
        run: podman pull "$BUILDER_IMAGE"

      - name: Generate rustdoc (generation errors fail; warnings visible in log)
        run: |
          podman run --rm \
            -v "$PWD":/build:Z -w /build \
            -e RUSTC_WRAPPER= -e CARGO_TARGET_DIR=/build/target \
            -e CARGO_INCREMENTAL=0 -e CARGO_BUILD_JOBS=2 -e CARGO_TERM_COLOR=always \
            "$BUILDER_IMAGE" \
            cargo doc --locked -p hyprstream-util --no-deps

      - name: Collect warning evidence (non-blocking)
        # Changing RUSTDOCFLAGS invalidates the rustdoc fingerprint, so this
        # re-runs the scoped doc and re-emits every warning; `-D warnings`
        # makes their presence observable as a step failure, and
        # continue-on-error keeps the JOB green while warnings remain.
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          podman run --rm \
            -v "$PWD":/build:Z -w /build \
            -e RUSTC_WRAPPER= -e CARGO_TARGET_DIR=/build/target \
            -e CARGO_INCREMENTAL=0 -e CARGO_BUILD_JOBS=2 -e CARGO_TERM_COLOR=always \
            -e 'RUSTDOCFLAGS=-D warnings' \
            "$BUILDER_IMAGE" \
            cargo doc --locked -p hyprstream-util --no-deps 2>&1 | tee rustdoc-warnings.log

      - name: Run documented examples (doctests)
        run: |
          podman run --rm \
            -v "$PWD":/build:Z -w /build \
            -e RUSTC_WRAPPER= -e CARGO_TARGET_DIR=/build/target \
            -e CARGO_INCREMENTAL=0 -e CARGO_BUILD_JOBS=2 -e CARGO_TERM_COLOR=always \
            "$BUILDER_IMAGE" \
            cargo test --locked -p hyprstream-util --doc

      - name: Upload warning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustdoc-hyprstream-util-warnings
          path: rustdoc-warnings.log
          if-no-files-found: warn

      - name: Upload generated API docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustdoc-hyprstream-util-html
          path: target/doc/
          if-no-files-found: error
