# Affected-set check: fast feedback for leaf-crate changes.
#
# Computes the workspace crates touched by a change and runs nextest + clippy
# on just that set in the pinned builder (~2-3 min for a leaf crate instead of
# the full gate's ~30 min). Root manifests, workspace-hack, toolchain, or
# .github changes fall back to the full default-members set. Pure-docs PRs
# no-op. Runs on the same self-hosted graviton pool as every other build job
# (hosted-runner zero scan: .github/build-matrix.json); uses its own sccache
# + CARGO_TARGET_DIR namespace (target/hyprstream-pr) so it never contends
# with the merge gate's target dir.
#
# Trigger split (long CI runs gate at merge, not on every PR push):
#   - pull_request : INFORMATIONAL feedback leg. continue-on-error keeps the
#     check green at the repo level even when the affected set fails — the
#     same computation re-runs as the blocking verdict at merge time.
#   - merge_group  : BLOCKING verdict ("pr-affected (merge gate)"), required
#     by the protection ruleset. It runs the identical affected-set
#     computation (pr_affected.py) against the synthetic merge candidate.
# House rules: no `|| true` — the cargo commands below must be able to fail.
name: PR affected-set

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  # sccache S3 backend, same as rust.yml: the OIDC step mints credentials and
  # podman's value-less `-e SCCACHE_BUCKET` forwards them by name. Without
  # these declarations the container sees unset vars and sccache silently
  # falls back to the checkout-local scratch dir — every run recompiles cold.
  SCCACHE_BUCKET: ${{ vars.AWS_SCCACHE_BUCKET }}
  SCCACHE_REGION: ${{ vars.AWS_SCCACHE_REGION }}

# PR legs cancel superseded runs on the same PR; merge_group runs are keyed
# by the queue ref and are NEVER cancelled by a new PR push.
concurrency:
  group: pr-affected-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  # Required-check placeholder. The protection ruleset requires the context
  # "pr-affected (merge gate)", which the real job only reports in merge_group
  # context; a required context that NEVER reports on a PR head blocks merge
  # queue entry ("required status checks are expected"). This no-op reports
  # the required context as an immediate success on PRs — the blocking
  # verdict is computed for real by the same-named job at merge_group time.
  # Skipped (not run) on merge_group so only one job ever emits the context.
  pr-affected-merge-gate-deferred:
    name: pr-affected (merge gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - run: |
        echo "Affected-set verdict is deferred to the merge queue: this context"
        echo "is a placeholder success on PR heads; the real nextest+clippy run"
        echo "gates the merge_group candidate. See the 'pr-affected (informational)'"
        echo "check on this PR for best-effort early feedback."

  pr-affected:
    name: pr-affected (${{ github.event_name == 'merge_group' && 'merge gate' || 'informational' }})
    # The PR leg is feedback only: a failure must not block review. The merge
    # queue leg is the required, blocking verdict.
    continue-on-error: ${{ github.event_name != 'merge_group' }}
    runs-on: [self-hosted, linux, arm64, graviton, hyprstream-merge-gate]
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0

    # The immutable arm64 builder image is shared by rust.yml, the preflight,
    # and AppImage packaging. Keep its sole pin in .github/builder-image.env.
    - name: Load builder image pin
      run: bash .github/scripts/load-builder-image.sh

    - name: Configure AWS credentials (OIDC → sccache S3)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_SCCACHE_ROLE_ARN }}
        aws-region: ${{ vars.AWS_SCCACHE_REGION }}
        role-session-duration: 14400

    - name: Pull builder image
      run: podman pull "$BUILDER_IMAGE"

    - name: Affected-set nextest + clippy (in rust-builder container)
      env:
        # pull_request: diff the PR head against its base. merge_group: diff
        # the synthetic merge-candidate head against its main-side base —
        # merge-base of those is the base itself, so the affected set is
        # exactly the PR's changes against the latest main.
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      run: |
        # Tests run as the image-baked unprivileged ci user (same as the
        # merge-gate build job): root ignores directory permissions, which
        # breaks the auth identity-store read-only-credential tests, so the
        # script chowns the checkout and drops to ci via runuser. sccache
        # scratch lives in the chowned checkout; the durable cache is
        # SCCACHE_BUCKET (S3). This container script must stay apostrophe-free
        # and comment-free: it is single-quoted and continued, so comments
        # inside it are argument-breaking syntax errors, not notes.
        podman run --rm \
          -v "$PWD":/build:Z -w /build \
          -v /mnt/hypr-ci-cache:/mnt/hypr-ci-cache \
          -e RUSTC_WRAPPER=sccache -e SCCACHE_BUCKET -e SCCACHE_REGION \
          -e SCCACHE_DIR=/build/.sccache -e SCCACHE_IDLE_TIMEOUT=0 \
          -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
          -e AWS_REGION -e AWS_DEFAULT_REGION \
          -e LIBTORCH=/opt/libtorch -e LD_LIBRARY_PATH=/opt/libtorch/lib \
          -e LIBTORCH_BYPASS_VERSION_CHECK=1 -e OPENSSL_NO_VENDOR=1 \
          -e CARGO_HOME=/root/.cargo -e RUSTUP_HOME=/root/.rustup \
          -e CARGO_TARGET_DIR=/mnt/hypr-ci-cache/target/hyprstream-pr \
          -e CARGO_INCREMENTAL=0 -e CARGO_TERM_COLOR=always -e TMPDIR=/build/.citmp \
          -e BASE_SHA -e HEAD_SHA \
          "$BUILDER_IMAGE" \
          bash -euo pipefail -c '
            install -d -o ci -g ci /mnt/hypr-ci-cache/target/hyprstream-pr /build/.citmp
            chown -R ci:ci /build
            runuser -u ci -- python3 -B .github/scripts/pr_affected.py
          '
