name: Build arm64 rust-builder image

# Publish the reusable aarch64 rust-builder image (Dockerfile target
# builder-cpu-arm64) to GHCR so merge-gate/CI jobs PULL a pre-built toolchain
# image (rust + capnproto + clang + the aarch64 libtorch wheel) instead of
# rebuilding it per job. sccache-S3 handles the incremental cargo cache on top.
#
# The image is built ON a Graviton runner (native arm64 — no qemu) and pushed
# with release tags by default. Reviewed manual candidates publish only their
# unique candidate tag; consumers use the resulting immutable manifest digest.
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Publish a candidate digest only (no latest tag or pin PR)
        type: boolean
        default: true
      expected_source_sha:
        description: Exact reviewed 40-hex commit selected by the workflow ref
        type: string
        required: true
  push:
    branches: [main, ewindisch/runner-smoke-test]
    paths:
      - 'Dockerfile'
      - 'rust-toolchain.toml'
      - '.github/workflows/build-image.yml'
  schedule:
    # Weekly rebuild to pick up base-image/toolchain security updates.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/hyprstream/rust-builder-arm64

jobs:
  publish-arm64-builder:
    runs-on: [self-hosted, linux, arm64, graviton, hyprstream-merge-gate]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify reviewed checkout and publication mode
        id: dispatch
        env:
          CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: bash .github/scripts/builder-dispatch.sh

      - name: Compute immutable tag (hash of all image inputs)
        id: tag
        env:
          MODE: ${{ steps.dispatch.outputs.mode }}
        run: |
          # Hash every input that affects image contents so the tag stays
          # content-addressed: the Dockerfile AND rust-toolchain.toml (COPYed in to
          # provision the pinned toolchain). Hashing only the Dockerfile would let a
          # toolchain-only change overwrite the same date-tag with different bytes.
          h=$(git hash-object Dockerfile rust-toolchain.toml | sha256sum | cut -c1-12)
          echo "sha=$h" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          if [[ "$MODE" == candidate ]]; then
            echo "image=$IMAGE:candidate-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          else
            echo "image=$IMAGE:$(date -u +%Y%m%d)-$h" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build arm64 builder image
        env:
          BUILD_IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          podman build \
            --target builder-cpu-arm64 \
            --build-arg VARIANT=cpu-arm64 \
            -t "$BUILD_IMAGE" \
            -f Dockerfile \
            .

      - name: Verify candidate library and native CPU runtime
        env:
          BUILD_IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          podman run --rm -v "$PWD":/build:ro,Z -w /build "$BUILD_IMAGE" \
            bash .github/scripts/verify-libtorch.sh /opt/libtorch --cpu-runtime

      - name: Push validated image
        id: push
        env:
          BUILD_IMAGE: ${{ steps.tag.outputs.image }}
          MODE: ${{ steps.dispatch.outputs.mode }}
        run: |
          digest_file="$RUNNER_TEMP/builder-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.digest"
          podman push --digestfile "$digest_file" "$BUILD_IMAGE"
          digest=$(cat "$digest_file")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ "$MODE" == release ]]; then
            podman tag "$BUILD_IMAGE" "$IMAGE:latest"
            podman push "$IMAGE:latest"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf 'Source: `%s`\nImage: `%s@%s`\nMode: `%s`\n' \
            "$GITHUB_SHA" "$IMAGE" "$digest" "$MODE" >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------------------------
      # Auto-bump the canonical builder-image pin. Every consumer loads this
      # tracked value after checkout, so one update moves rust.yml, preflight, and
      # AppImage packaging together. CI pins by digest for reproducibility; this
      # opens a PR to move that pin whenever a new image is published. The
      # PR self-validates: the merge gate runs against the new image, so a broken
      # image simply never merges and the old digest stays live.
      #
      # The PR MUST be authored by a non-GITHUB_TOKEN identity: a PR opened with the
      # default GITHUB_TOKEN can create a pull_request run, but it lands in an
      # approval-required state and does not drive the required checks unattended, so
      # the merge gate never self-validates. Use a fine-grained PAT (secret
      # BUILDER_IMAGE_BUMP_TOKEN), scoped to THIS repo with only Contents + Pull
      # requests write. (Actions OIDC cannot be used here — it federates to EXTERNAL
      # providers like AWS, not to GitHub's own API.) If the secret is unset the bump
      # step is skipped with a warning (image still published; bump the canonical
      # .github/builder-image.env manually until the PAT is provisioned).
      # -------------------------------------------------------------------------
      - name: Rewrite the canonical builder-image pin if the digest changed
        id: pin
        if: steps.dispatch.outputs.mode == 'release'
        run: |
          new="$IMAGE@${{ steps.push.outputs.digest }}"
          cur=$(cat .github/builder-image.env)
          echo "current=$cur"
          echo "new=$new"
          if [ "$cur" = "$new" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          printf '%s\n' "$new" > .github/builder-image.env
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check for the bump PAT
        id: bot
        if: steps.dispatch.outputs.mode == 'release'
        env:
          BOT: ${{ secrets.BUILDER_IMAGE_BUMP_TOKEN }}
        run: |
          if [ -n "$BOT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::BUILDER_IMAGE_BUMP_TOKEN not set — skipping the auto digest-bump PR (image is published; bump .github/builder-image.env manually until the PAT is provisioned)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open digest-bump PR
        if: steps.dispatch.outputs.mode == 'release' && steps.pin.outputs.changed == 'true' && steps.bot.outputs.present == 'true'
        # Pinned to a full commit SHA (not a mutable tag): this step runs with a
        # write-capable PAT, so an upstream tag move must not silently change what
        # executes here.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.BUILDER_IMAGE_BUMP_TOKEN }}
          branch: automation/bump-builder-image
          base: main
          add-paths: .github/builder-image.env
          commit-message: "ci: bump canonical rust-builder image digest"
          title: "ci: bump canonical rust-builder image digest (automated)"
          labels: automation, ci
          delete-branch: true
          body: |
            Automated bump of the shared builder-image pin in
            `.github/builder-image.env` to the digest just published by
            `build-image.yml`.

            - digest: `${{ steps.push.outputs.digest }}`
            - tag: `${{ steps.tag.outputs.date }}-${{ steps.tag.outputs.sha }}`

            **Self-validating:** the merge gate runs the full arm64 build+test against
            this new image. If a baked tool is missing or wrong, this PR will not merge
            and the previous digest stays live. Enable auto-merge if unattended bumps
            are desired.
