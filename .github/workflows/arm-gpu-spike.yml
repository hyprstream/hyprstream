name: ARM GPU packaging spike

# Dispatch-only reconnaissance. This is intentionally not a PR or merge gate:
# it downloads a large aarch64 CUDA wheel and exercises an experimental ABI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda130-aarch64:
    name: CUDA 13.0 aarch64 libtorch compatibility
    runs-on: [self-hosted, linux, arm64, graviton, hyprstream-merge-gate]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Build the arm64 CUDA libtorch spike image
        run: |
          podman build \
            --target builder-cuda130-arm64-spike \
            -t hyprstream-cuda130-arm64-spike:ci \
            -f Dockerfile \
            .

      - name: Verify native CUDA wheel and compile Hyprstream
        run: |
          podman run --rm \
            -v "$PWD":/build:Z -w /build \
            -e OPENSSL_NO_VENDOR=1 \
            -e LIBTORCH=/opt/libtorch \
            -e LD_LIBRARY_PATH=/opt/libtorch/lib \
            -e LIBTORCH_BYPASS_VERSION_CHECK=1 \
            -e CARGO_INCREMENTAL=0 \
            hyprstream-cuda130-arm64-spike:ci \
            bash -euo pipefail -c '
              test -s /opt/libtorch/lib/libtorch_cuda.so
              python3 -c "import torch; print(torch.__version__, torch.version.cuda, torch.cuda.is_available())"
              cargo build -p hyprstream --release --features otel
              ldd target/release/hyprstream | grep -E "libtorch|not found" || true
            '

      - name: Record GPU availability
        run: |
          if command -v nvidia-smi >/dev/null; then
            nvidia-smi || echo "::notice::nvidia-smi is installed but no usable NVIDIA driver/device is attached"
          else
            echo '::notice::No NVIDIA device is attached to this Graviton build runner; this spike validates packaging and linking only.'
          fi

  rocm-aarch64-inventory:
    name: ROCm aarch64 wheel inventory
    runs-on: ubuntu-latest
    steps:
      - name: Record current ROCm aarch64 availability
        run: |
          set -euo pipefail
          curl -fsSL https://download.pytorch.org/whl/rocm7.1/torch/ > /tmp/rocm71-torch-index.html
          matches=$(grep -oE 'torch-[^" ]+aarch64\.whl' /tmp/rocm71-torch-index.html | sort -u || true)
          printf '%s\n' "$matches"
          if printf '%s\n' "$matches" | grep -Eq 'torch-(2\.(8|9|[1-9][0-9]+)|[3-9][0-9]*\.)'; then
            echo '::notice::Modern ROCm aarch64 wheels detected; reassess the ROCm packaging path.'
          else
            echo '::notice::No modern ROCm aarch64 wheel is currently available; keep ROCm AppImages x86_64-only.'
          fi

  # Fail-closed enable gate for the GATED appimage-aarch64-cuda130 row in
  # .github/build-matrix.json (native CI plan N3.1-N3.3). This job is
  # EXPECTED TO FAIL on today's GPU-less Graviton pool — a red dispatch is
  # the recorded proof that ARM CUDA rows must stay gated. It can only go
  # green on a runner with a real NVIDIA device + driver, and its output
  # (driver version, CUDA capability, device count) is the hardware evidence
  # the manifest row requires in gate.hardware_proof before status may become
  # active (enforced by scripts/check_build_matrix.py).
  #
  # Do NOT add `|| true`, continue-on-error, or a no-GPU pass path: that would
  # convert the gate into a rubber stamp and let build-only linking pose as
  # runtime CUDA support.
  arm-cuda-enable-preflight:
    name: ARM CUDA enable preflight (fail-closed)
    runs-on: [self-hosted, linux, arm64, graviton, hyprstream-merge-gate]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Explain the gate
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ARM CUDA enable preflight (fail-closed)

          Expected result on the current fleet: **failure** — no ARM64 host
          has an attached NVIDIA GPU (spike run 32897623715 recorded
          `torch.cuda.is_available() == False`). A green run on real hardware
          is the evidence required to activate the gated
          `appimage-aarch64-cuda130` row in `.github/build-matrix.json`.
          Treat any green run without a recorded `nvidia-smi` below as
          suspicious.
          EOF

      - name: Require an NVIDIA device on the host
        run: |
          set -euo pipefail
          command -v nvidia-smi >/dev/null 2>&1 || {
            echo '::error::arm-cuda-enable-preflight: no nvidia-smi on this runner — the arm64-cuda130 matrix row stays gated.' >&2
            exit 1
          }
          nvidia-smi
          nvidia-smi --query-gpu=name,driver_version,compute_cap --format=csv

      - name: Build the arm64 CUDA libtorch spike image
        run: |
          podman build \
            --target builder-cuda130-arm64-spike \
            -t hyprstream-cuda130-arm64-spike:preflight \
            -f Dockerfile \
            .

      - name: Runtime CUDA gate inside the toolchain image
        run: |
          podman run --rm \
            --device nvidia.com/gpu=all \
            -v "$PWD":/build:Z -w /build \
            -e LIBTORCH=/opt/libtorch \
            -e LD_LIBRARY_PATH=/opt/libtorch/lib \
            -e LIBTORCH_BYPASS_VERSION_CHECK=1 \
            hyprstream-cuda130-arm64-spike:preflight \
            bash -euo pipefail -c '
              test -s /opt/libtorch/lib/libtorch_cuda.so
              python3 - <<PY
              import sys, torch
              print("torch", torch.__version__, "cuda", torch.version.cuda)
              if not torch.cuda.is_available():
                  print("torch.cuda.is_available() is False: device passthrough or driver is not usable", file=sys.stderr)
                  sys.exit(1)
              if torch.cuda.device_count() < 1:
                  print("torch.cuda.device_count() < 1", file=sys.stderr)
                  sys.exit(1)
              p = torch.cuda.get_device_properties(0)
              print(f"GPU0 {p.name} capability sm_{p.major}{p.minor}")
              PY
              # A CUDA build that silently resolves to CPU is exactly what
              # this gate exists to catch: the linked binary must carry the
              # CUDA runtime before packaging may claim the backend.
              cargo build -p hyprstream --release --features otel
              ldd target/release/hyprstream | grep -q libtorch_cuda
            '

      - name: Record activation evidence
        if: success()
        run: |
          {
            echo "## ARM CUDA preflight — green"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- record this URL in .github/build-matrix.json rows[appimage-aarch64-cuda130].gate.hardware_proof"
          } >> "$GITHUB_STEP_SUMMARY"
