name: Build Docker Images

on:
  # Merge-queue candidates pass the Rust gate before GitHub lands their exact
  # SHA on main. Publish that landed SHA directly; Rust intentionally has no
  # duplicate push-to-main run (#1331).
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hyprstream/hyprstream

# Serialize publication without cancelling a process that may already be
# pushing. Platform images use revision-qualified staging tags, and the
# manifest job refuses to move main tags when its SHA is no longer main.
concurrency:
  group: docker-publish-${{ github.ref == 'refs/heads/main' && 'main' || 'release' }}
  cancel-in-progress: false

jobs:
  verify-source:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
    - name: Verify protected-main Rust gate
      if: github.ref == 'refs/heads/main'
      env:
        EXPECTED_SHA: ${{ github.sha }}
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        runs="$(
          gh api \
            "repos/${REPOSITORY}/actions/runs?head_sha=${EXPECTED_SHA}&event=merge_group&per_page=100"
        )"
        matches="$(
          jq \
            --arg sha "$EXPECTED_SHA" \
            '[
              .workflow_runs[] |
              select(
                .name == "Rust" and
                .path == ".github/workflows/rust.yml" and
                .event == "merge_group" and
                .head_sha == $sha and
                .conclusion == "success"
              )
            ] | length' \
            <<< "$runs"
        )"
        if [ "$matches" -lt 1 ]; then
          echo "::error::refusing to publish ${EXPECTED_SHA}: no successful Rust merge-group gate found"
          exit 1
        fi

  build-docker:
    needs: verify-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda128, cuda130, rocm71]
        include:
          - variant: cpu
            tag_suffix: cpu
            docker_variant: cpu
          - variant: cuda128
            tag_suffix: cuda128
            docker_variant: cuda128
          - variant: cuda130
            tag_suffix: cuda130
            docker_variant: cuda130
          - variant: rocm71
            tag_suffix: rocm71
            docker_variant: rocm71

    steps:
    - name: Clean up disk space before build
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean
        docker system prune -af --volumes || true
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Main only lands merge-queue SHAs that passed Rust; tag pushes resolve
        # to their tagged SHA. Build exactly the revision that triggered us.
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          # PR builds - tagged as pr-{number}
          type=ref,event=pr,suffix=-${{ matrix.tag_suffix }},prefix=pr-,enable=${{ matrix.variant != 'cpu' }}
          # Branch builds (excluding main) - tagged as {branch}
          type=ref,event=branch,suffix=-${{ matrix.tag_suffix }},enable=${{ matrix.variant != 'cpu' && github.ref_name != 'main' }}
          # Tag builds (releases) - semantic versioning
          type=semver,pattern={{version}},suffix=-${{ matrix.tag_suffix }},enable=${{ matrix.variant != 'cpu' }}
          type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.tag_suffix }},enable=${{ matrix.variant != 'cpu' }}
          # Latest tag for main branch
          type=raw,value=latest,enable=${{ matrix.variant != 'cpu' && github.ref == 'refs/heads/main' }},suffix=-${{ matrix.tag_suffix }}
          # Immutable architecture-specific CPU staging tag. The manifest job
          # composes only this exact revision, never a moving platform tag.
          type=raw,value=sha-${{ github.sha }},suffix=-cpu-amd64,enable=${{ matrix.variant == 'cpu' }}
          # Release-only architecture tags remain for compatibility.
          type=semver,pattern={{version}},suffix=-cpu-amd64,enable=${{ matrix.variant == 'cpu' }}
          type=semver,pattern={{major}}.{{minor}},suffix=-cpu-amd64,enable=${{ matrix.variant == 'cpu' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        build-args: |
          VARIANT=${{ matrix.docker_variant }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64
        # Registry cache: no 10GB limit, persists across branches, faster than GHA cache
        cache-from: |
          type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.variant }}
          type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-base
        cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.variant }},mode=max

    - name: Generate SBOM
      if: github.event_name != 'pull_request'
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        format: spdx-json
        output-file: sbom-${{ matrix.variant }}.spdx.json

    - name: Upload SBOM
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: sbom-${{ matrix.variant }}
        path: sbom-${{ matrix.variant }}.spdx.json

    - name: Clean up disk space after build
      if: always()
      run: |
        echo "=== Cleaning up after ${{ matrix.variant }} build ==="
        docker system prune -af --volumes || true
        rm -rf ~/.cargo/registry/cache ~/.cargo/git
        sudo apt-get autoremove -y || true
        echo "=== Disk usage after cleanup ==="
        df -h

  # ==========================================================================
  # Native linux/arm64 CPU image (closes #1012)
  # ==========================================================================
  # Built on the self-hosted Graviton (arm64 / Rocky-10 / rootless-podman)
  # runner — the SAME layer graviton-build-validate.yml, build-image.yml, and
  # the rust.yml merge-gate use. Native arm64 is used INSTEAD of QEMU
  # emulation because emulated Rust + libtorch builds time out at the link step.
  #
  # The golden AMI exposes rootless podman only (no /var/run/docker.sock — see
  # the rust.yml header comment), so this leg drives `podman build`/`podman
  # push` directly and CANNOT use docker/build-push-action like the amd64 leg.
  #
  # Tag scheme (GHCR; consumed by the AWS rocky10 arm64 quadlets):
  #   sha-<full-revision>-cpu-arm64 — immutable manifest staging input
  #   1.2.3-cpu-arm64      — immutable, on v*.*.* release tags
  #   1.2-cpu-arm64        — rolling major.minor, on v*.*.* release tags
  # NOTE: docker/metadata-action `type=semver,pattern={{version}}` STRIPS the
  # leading `v` (emits `1.2.3`, not `v1.2.3`) — the same {{version}} form the
  # amd64 leg uses. Consumers pull the UNPREFIXED tag. {{raw}} would keep the
  # `v`; we intentionally match the amd64 leg's unprefixed contract.
  # The amd64 cpu/cuda/rocm variants stay on the github-hosted build-docker job
  # above; only the CPU variant has an arm64 counterpart (CUDA/ROCm are
  # x86_64-only today).
  #
  # Security: this job holds `packages: write` on a privileged self-hosted
  # Graviton runner. Only pushes to this repository's protected main branch or
  # version tags can schedule it; pull requests and fork branches cannot.
  build-docker-arm64:
    needs: verify-source
    runs-on: [self-hosted, linux, arm64, graviton, hyprstream-merge-gate]
    # Fleet reaper hard-kills Graviton instances at 150 min from LAUNCH (not
    # job start); rust.yml uses 140 for the same reason. Stay below the cap so
    # the always() cleanup runs and the push isn't lost to a reaped host.
    timeout-minutes: 140
    permissions:
      contents: read
      packages: write
    env:
      # The golden AMI root filesystem is only 29 GB. Put all image layers and
      # BuildKit cache mounts on the dedicated 196 GB CI-cache volume instead.
      PODMAN_ROOT: /mnt/hypr-ci-cache/podman-image-${{ github.run_id }}-${{ github.run_attempt }}
      PODMAN_RUNROOT: /mnt/hypr-ci-cache/podman-run-${{ github.run_id }}-${{ github.run_attempt }}
    # Two concurrence regimes:
    #  - main builds are serialized without cancellation; each writes only its
    #    immutable revision staging tag, and stale runs cannot move canonical
    #    tags in the manifest job.
    #  - release (tag) publishes contend on the mutable ROLLING tag
    #    (e.g. 1.2-cpu-arm64) regardless of version, so ALL releases share a
    #    single serialized group with cancel-in-progress FALSE — an in-flight
    #    release publish is never cancelled mid-push, so the rolling tag can't
    #    be rolled back or skipped by an out-of-order concurrent release.
    # Job-scoped so the amd64 leg (no concurrency guard) stays byte-for-byte
    # unchanged.
    concurrency:
      group: arm64-publish-${{ github.ref == 'refs/heads/main' && 'main' || 'release' }}
      cancel-in-progress: false

    steps:
    # Main only lands merge-queue SHAs that passed Rust. For tag pushes,
    # github.sha is the tagged commit.
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        # Do not persist the GITHUB_TOKEN into .git/config on the self-hosted
        # runner (actions/checkout writes it there by default for later git
        # pushes). This job only reads; the token must not outlive the step.
        persist-credentials: false

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      env:
        REGISTRY_USER: ${{ github.actor }}
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Never interpolate secrets into the command line (visible in /proc and
      # ps). Pipe via --password-stdin so the token stays out of argv.
      run: |
        echo "$REGISTRY_TOKEN" | podman login ghcr.io -u "$REGISTRY_USER" --password-stdin

    # docker/metadata-action is a pure node action (no docker daemon needed) so
    # it runs fine on the podman-only runner; it just emits the tag set.
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          # Immutable architecture-specific staging tag
          type=raw,value=sha-${{ github.sha }},suffix=-cpu-arm64
          # Tag builds (releases) — semver, arm64 CPU suffix
          type=semver,pattern={{version}},suffix=-cpu-arm64
          type=semver,pattern={{major}}.{{minor}},suffix=-cpu-arm64

    - name: Build arm64 CPU image (native podman, no QEMU)
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        set -euo pipefail
        mkdir -p "$PODMAN_ROOT" "$PODMAN_RUNROOT"
        # Turn the newline-separated tag list into repeated `-t` args.
        tag_args=()
        while IFS= read -r t; do
          [ -n "$t" ] && tag_args+=( -t "$t" )
        done <<< "$TAGS"
        if [ "${#tag_args[@]}" -eq 0 ]; then
          echo "::error::no image tags resolved; refusing to build an untagged image"
          exit 1
        fi
        echo "### Building linux/arm64 CPU image with tags" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        printf '  %s\n' "${tag_args[@]}" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        podman --root "$PODMAN_ROOT" --runroot "$PODMAN_RUNROOT" build \
          --target runtime \
          --build-arg VARIANT=cpu-arm64 \
          "${tag_args[@]}" \
          -f Dockerfile \
          .

    - name: Push image tags
      if: github.event_name != 'pull_request'
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        set -euo pipefail
        while IFS= read -r t; do
          [ -n "$t" ] && podman --root "$PODMAN_ROOT" --runroot "$PODMAN_RUNROOT" push "$t"
        done <<< "$TAGS"

    - name: Clean up disk space after build
      if: always()
      run: |
        echo "=== Cleaning up after arm64 CPU build ==="
        podman --root "$PODMAN_ROOT" --runroot "$PODMAN_RUNROOT" system reset --force || true
        rm -rf ~/.cargo/registry/cache ~/.cargo/git 2>/dev/null || true
        echo "=== Disk usage after cleanup ==="
        df -h

  # Publish the normal CPU contract as an OCI index only after both native
  # builds succeeded. The Graviton target can keep pulling `latest-cpu`; GHCR
  # selects linux/arm64 while existing x86 hosts receive linux/amd64.
  publish-cpu-manifest:
    needs: [build-docker, build-docker-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      env:
        REGISTRY_USER: ${{ github.actor }}
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

    - name: Check publication freshness
      id: freshness
      env:
        EXPECTED_SHA: ${{ github.sha }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo "aliases=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! current_sha="$(
          git ls-remote "https://github.com/${REPOSITORY}.git" refs/heads/main |
            awk 'NR == 1 { print $1 }'
        )"; then
          echo "aliases=false" >> "$GITHUB_OUTPUT"
          echo "::warning::could not resolve current main; publishing immutable index only"
          exit 0
        fi
        if [ "$current_sha" = "$EXPECTED_SHA" ]; then
          echo "aliases=true" >> "$GITHUB_OUTPUT"
        else
          echo "aliases=false" >> "$GITHUB_OUTPUT"
          echo "::notice::not moving canonical CPU tags: ${EXPECTED_SHA} is stale; main is ${current_sha}"
        fi

    - name: Extract CPU manifest tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          # Every validated build gets an immutable, revision-qualified index.
          type=raw,value=sha-${{ github.sha }},suffix=-cpu
          type=semver,pattern={{version}},suffix=-cpu
          type=semver,pattern={{major}}.{{minor}},suffix=-cpu
          # Only the current main revision may move canonical aliases.
          type=raw,value=edge,suffix=-cpu,enable=${{ github.ref == 'refs/heads/main' && steps.freshness.outputs.aliases == 'true' }}
          type=raw,value=latest,suffix=-cpu,enable=${{ github.ref == 'refs/heads/main' && steps.freshness.outputs.aliases == 'true' }}

    - name: Publish multi-arch CPU manifests
      id: publish
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
        IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        REVISION: ${{ github.sha }}
      run: |
        set -euo pipefail
        while IFS= read -r tag; do
          [ -n "$tag" ] || continue
          metadata="$(mktemp)"
          docker buildx imagetools create \
            --metadata-file "$metadata" \
            --tag "$tag" \
            "${IMAGE}:sha-${REVISION}-cpu-amd64" \
            "${IMAGE}:sha-${REVISION}-cpu-arm64"
          docker buildx imagetools inspect "$tag"
          digest="$(jq -er '."containerimage.descriptor".digest' "$metadata")"
          rm -f "$metadata"
          docker buildx imagetools inspect "${IMAGE}@${digest}"
          echo "${tag}@${digest}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        done <<< "$TAGS"
