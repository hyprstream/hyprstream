# Public Rust crate release policy. Every package under crates/*/Cargo.toml must
# appear exactly once. The order of public_now is the crates.io publish order.
registry = "crates-io"
tag_prefix = "crates-v"
environment = "crates-io-publish"

public_now = [
  "hyprstream-rpc-build",
  "hyprstream-rpc-derive",
  "hyprstream-crypto",
  "hyprstream-rpc",
]

public_later = [
  "bitsandbytes-sys",
  "cas-serve",
  "git-xet-filter",
  "git2db",
  "hyprstream-9p",
  "hyprstream-compositor",
  "hyprstream-containedfs",
  "hyprstream-discovery",
  "hyprstream-flight",
  "hyprstream-k8s",
  "hyprstream-ledger",
  "hyprstream-metrics",
  "hyprstream-p2p",
  "hyprstream-pds",
  "hyprstream-pds-service",
  "hyprstream-resource",
  "hyprstream-rpc-std",
  "hyprstream-service",
  "hyprstream-tui",
  "hyprstream-util",
  "hyprstream-vfs",
  "hyprstream-vfs-server",
  "hyprstream-workers",
  "hyprstream-workers-python",
  "hyprstream-workers-tcl",
  "hyprstream-workers-wasmtime",
  "waxterm",
]

internal = [
  "chat-core",
  "hyprstream",
  "hyprstream-appview",
  "hyprstream-workers-python-guest",
  "hyprstream-workers-wasmtime-fsguest",
]

# The real service is deliberately not publishable. Replacing the stale public
# `hyprstream` name requires a separate, Apache-2.0 deprecation-shim package;
# do not republish the service merely to occupy that name.
[deprecation_shim]
package_name = "hyprstream"
source_service = "hyprstream"
license = "Apache-2.0"
version = "0.5.0"
manifest_path = "release/hyprstream-deprecation-shim/Cargo.toml"
required_before_yank = true
release_order = ["publish-shim", "verify-shim", "yank-stale-versions"]

# Approved target boundary.  These values describe the intended per-crate
# relicensing change; they do not alter a Cargo.toml license field themselves.
[license_boundary]
agpl_license = "AGPL-3.0-only"
apache_license = "Apache-2.0"

agpl_services = [
  "hyprstream",
  "hyprstream-appview",
  "hyprstream-discovery",
  "hyprstream-k8s",
  "hyprstream-ledger",
  "hyprstream-pds",
  "hyprstream-pds-service",
  "hyprstream-service",
]

apache_crates = [
  "hyprstream-crypto",
  "hyprstream-rpc",
  "hyprstream-rpc-build",
  "hyprstream-rpc-derive",
  "hyprstream-rpc-std",
  "hyprstream-tui",
  "hyprstream-util",
  "hyprstream-vfs",
  "hyprstream-workers-python",
  "hyprstream-workers-python-guest",
  "hyprstream-workers-tcl",
  "hyprstream-workers-wasmtime",
  "hyprstream-workers-wasmtime-fsguest",
]

# Execution runtimes are Apache-2.0.  The inference runtime
# still lives inside the AGPL service crate, and the workers facade still has
# service wiring, so neither package-level boundary can be expressed yet.
apache_runtime_targets = [
  "hyprstream-workers",
  "hyprstream-workers-python",
  "hyprstream-workers-python-guest",
  "hyprstream-workers-tcl",
  "hyprstream-workers-wasmtime",
  "hyprstream-workers-wasmtime-fsguest",
]
topology_blocked_runtime_targets = ["hyprstream-workers"]

[license_boundary.inference_runtime]
source_crate = "hyprstream"
source_paths = ["src/runtime", "src/inference"]
target_license = "Apache-2.0"
extraction_required = true
