# Public Rust crate release policy. Every package under crates/*/Cargo.toml must
# appear exactly once. The order of public_now is the crates.io publish order.
registry = "crates-io"
tag_prefix = "crates-v"
environment = "crates-io-publish"

public_now = [
  "hyprstream-rpc-build",
  "hyprstream-rpc-derive",
]

public_later = [
  "bitsandbytes-sys",
  "cas-serve",
  "git-xet-filter",
  "git2db",
  "hyprstream-9p",
  "hyprstream-compositor",
  "hyprstream-containedfs",
  "hyprstream-crypto",
  "hyprstream-discovery",
  "hyprstream-flight",
  "hyprstream-k8s",
  "hyprstream-ledger",
  "hyprstream-metrics",
  "hyprstream-p2p",
  "hyprstream-pds",
  "hyprstream-pds-service",
  "hyprstream-resource",
  "hyprstream-rpc",
  "hyprstream-rpc-std",
  "hyprstream-service",
  "hyprstream-tui",
  "hyprstream-util",
  "hyprstream-vfs",
  "hyprstream-vfs-server",
  "hyprstream-workers",
  "hyprstream-workers-python",
  "hyprstream-workers-tcl",
  "hyprstream-workers-wasmtime",
  "waxterm",
]

internal = [
  "chat-core",
  "hyprstream",
  "hyprstream-appview",
  "hyprstream-workers-python-guest",
  "hyprstream-workers-wasmtime-fsguest",
]

# Approved target boundary.  These values describe the intended per-crate
# relicensing change; they do not alter a Cargo.toml license field themselves.
[license_boundary]
agpl_license = "AGPL-3.0-only"
permissive_license = "PENDING_OPERATOR_DECISION"
permissive_license_options = ["Apache-2.0", "MIT OR Apache-2.0"]

agpl_services = [
  "hyprstream",
  "hyprstream-appview",
  "hyprstream-discovery",
  "hyprstream-k8s",
  "hyprstream-ledger",
  "hyprstream-pds",
  "hyprstream-pds-service",
  "hyprstream-service",
]

permissive_crates = [
  "hyprstream-crypto",
  "hyprstream-rpc",
  "hyprstream-rpc-build",
  "hyprstream-rpc-derive",
  "hyprstream-rpc-std",
  "hyprstream-tui",
  "hyprstream-util",
  "hyprstream-vfs",
]
